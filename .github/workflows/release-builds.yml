name: Release Builds

on:
  # 允许手动从Actions标签页触发
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # Darwin/macOS
          - goos: darwin
            goarch: arm64
            output: golua-darwin-arm64
          
          # Windows
          - goos: windows
            goarch: amd64
            output: golua-windows-amd64.exe
          - goos: windows
            goarch: 386
            output: golua-windows-x86.exe
          - goos: windows
            goarch: arm64
            output: golua-windows-arm64.exe
          
          # Linux
          - goos: linux
            goarch: amd64
            output: golua-linux-amd64
          - goos: linux
            goarch: 386
            output: golua-linux-x86
          - goos: linux
            goarch: arm64
            output: golua-linux-arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.23

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: go build -trimpath -ldflags="-s -w" -o ${{ matrix.output }}
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output }}
          path: ${{ matrix.output }}
          if-no-files-found: error
          retention-days: 7
          
  # 创建一个合并所有文件的job
  collect:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./binaries
          
      - name: Zip binaries
        run: |
          cd ./binaries
          zip -r ../golua-all-platforms.zip ./*
          
      - name: Upload combined zip
        uses: actions/upload-artifact@v4
        with:
          name: golua-all-platforms
          path: golua-all-platforms.zip
          retention-days: 7