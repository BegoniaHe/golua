name: Release Builds

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # Darwin/macOS
          - goos: darwin
            goarch: arm64
            output: golua-darwin-arm64
          
          # Windows
          - goos: windows
            goarch: amd64
            output: golua-windows-amd64.exe
          - goos: windows
            goarch: 386
            output: golua-windows-x86.exe
          - goos: windows
            goarch: arm64
            output: golua-windows-arm64.exe
          
          # Linux
          - goos: linux
            goarch: amd64
            output: golua-linux-amd64
          - goos: linux
            goarch: 386
            output: golua-linux-x86
          - goos: linux
            goarch: arm64
            output: golua-linux-arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.20'

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: go build -trimpath -ldflags="-s -w" -o ${{ matrix.output }}
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output }}
          path: ${{ matrix.output }}
          if-no-files-found: error
          retention-days: 7
          
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./binaries
      
      - name: Create release directory
        run: mkdir -p release
          
      - name: Prepare release files
        run: |
          # 将所有二进制文件移动到release目录
          find ./binaries -type f -not -path "*/\.*" -exec cp {} ./release/ \;
          
          # 创建一个包含所有二进制文件的zip
          cd ./release
          zip -r ../golua-all-platforms.zip *
          cd ..
          
          # 将zip文件也放入release目录
          cp golua-all-platforms.zip ./release/
      
      - name: Get current date
        id: date
        run: echo "DATE=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT
      
      - name: Delete existing pre-release
        uses: dev-drprasad/delete-tag-and-release@v1.0
        with:
          tag_name: pre-release
          delete_release: true
          github_token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
      
      - name: Create pre-release
        uses: softprops/action-gh-release@v1
        with:
          name: "Development Build (${{ steps.date.outputs.DATE }})"
          tag_name: pre-release
          files: ./release/*
          prerelease: true
          generate_release_notes: true
          body: |
            This is an automatically generated pre-release build.
            
            Build date: ${{ steps.date.outputs.DATE }}
            Build commit: ${{ github.sha }}
            
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}